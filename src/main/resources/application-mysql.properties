# Run with: -Dspring.profiles.active=mysql  (or set in IntelliJ Run Configuration > Active profiles)
# First create the DB in MySQL:  CREATE DATABASE librarydb;
spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
